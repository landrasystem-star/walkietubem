<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WALKIE Tube - 16 Canales</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a0f, #1a1a2e);
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 20px;
        }
        
        /* HEADER ESTILO YOUTUBE */
        .youtube-header {
            background: #202020;
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-icon { font-size: 2rem; }
        .logo-text {
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
        }
        .logo-text span { color: #ff6b6b; }
        .stats { color: #888; font-size: 0.85rem; }
        
        /* GRID DE MINIATURAS (4x4 = 16 canales) */
        .thumbnails-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }
        
        /* TARJETA MINIATURA (como video de YouTube) */
        .thumbnail-card {
            background: #1e1e2a;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid transparent;
        }
        .thumbnail-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,.5);
            border-color: #2ed573;
        }
        .thumbnail-card.active {
            border-color: #2ed573;
            box-shadow: 0 0 15px #2ed573;
        }
        
        .thumbnail-img {
            background: #0a0a0f;
            padding: 20px 10px;
            text-align: center;
            position: relative;
        }
        .thumbnail-img .emoji-big {
            font-size: 3rem;
        }
        .thumbnail-img .status-led {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #888;
        }
        .thumbnail-img .status-led.online {
            background: #2ed573;
            box-shadow: 0 0 5px #2ed573;
        }
        .thumbnail-img .status-led.offline {
            background: #ff4757;
        }
        
        .thumbnail-info {
            padding: 12px;
        }
        .thumbnail-title {
            font-weight: bold;
            color: white;
            font-size: 0.9rem;
            margin-bottom: 4px;
        }
        .thumbnail-channel {
            color: #2ed573;
            font-size: 0.7rem;
            font-family: monospace;
            margin-bottom: 8px;
        }
        .thumbnail-stats {
            color: #888;
            font-size: 0.65rem;
            display: flex;
            justify-content: space-between;
        }
        
        /* REPRODUCTOR GRANDE (walkie completo) */
        .player-container {
            background: #2c2c3e;
            border-radius: 45px;
            padding: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,.5);
            margin-top: 20px;
            transition: all 0.3s;
        }
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #2ed573;
        }
        .player-header h2 {
            color: #ff6b6b;
            margin: 0;
            font-size: 1.4rem;
        }
        .player-header .close-player {
            background: #e74c3c;
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
        }
        
        /* Walkie dentro del player */
        .walkie-player {
            min-height: 500px;
        }
        
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #2ed573;
            color: #0a0a0f;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            z-index: 2000;
            font-weight: bold;
            pointer-events: none;
        }
        
        @media (max-width: 900px) {
            .thumbnails-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            .thumbnail-img .emoji-big { font-size: 2rem; }
            .thumbnail-title { font-size: 0.8rem; }
        }
        
        @media (max-width: 500px) {
            .thumbnails-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="youtube-header">
        <div class="logo">
            <div class="logo-icon">📺</div>
            <div class="logo-text">WALKIE<span>Tube</span></div>
        </div>
        <div class="stats">
            🟢 16 canales | Haz clic en cualquier miniatura para abrir el walkie completo
        </div>
    </div>

    <!-- Grid de miniaturas (4x4 = 16 canales) -->
    <div class="thumbnails-grid" id="thumbnailsGrid"></div>

    <!-- Reproductor grande (walkie completo) -->
    <div id="playerContainer" class="player-container" style="display: none;">
        <div class="player-header">
            <h2 id="playerTitle">📞 WALKIE</h2>
            <button class="close-player" id="closePlayerBtn">✖ CERRAR</button>
        </div>
        <div id="walkiePlayer" class="walkie-player"></div>
    </div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(function(){
    // Configuración de servidores
    const ICE_SERVERS = {
        iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'stun:stun2.l.google.com:19302' },
            { urls: 'stun:stun3.l.google.com:19302' },
            { urls: 'stun:stun4.l.google.com:19302' },
            { urls: 'stun:stun.cloudflare.com:3478' },
            { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
            { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
            { urls: 'turn:openrelay.metered.ca:3478', username: 'openrelayproject', credential: 'openrelayproject' }
        ],
        iceCandidatePoolSize: 10,
        iceTransportPolicy: 'all'
    };
    const PEER_CONFIG = { host: '0.peerjs.com', port: 443, secure: true, config: ICE_SERVERS, debug: 0 };

    // Definición de 16 canales
    const canales = [
        // Canal 1-4 (originales)
        { id: 0, nombre: "CANAL 1", userA: "moncho", userB: "luci", emoji: "🎤", color: "#ff6b6b" },
        { id: 1, nombre: "CANAL 2", userA: "MONCHO", userB: "diana", emoji: "🎧", color: "#ffa502" },
        { id: 2, nombre: "CANAL 3", userA: "MoNCHo", userB: "jorge", emoji: "🎵", color: "#9b59b6" },
        { id: 3, nombre: "CANAL 4", userA: "user1", userB: "user2", emoji: "📡", color: "#3498db" },
        // Canales 5-8
        { id: 4, nombre: "CANAL 5", userA: "familia1", userB: "familia2", emoji: "🏠", color: "#2ed573" },
        { id: 5, nombre: "CANAL 6", userA: "trabajo1", userB: "trabajo2", emoji: "💼", color: "#ff6b6b" },
        { id: 6, nombre: "CANAL 7", userA: "amigos1", userB: "amigos2", emoji: "👥", color: "#ffa502" },
        { id: 7, nombre: "CANAL 8", userA: "estudio1", userB: "estudio2", emoji: "📚", color: "#9b59b6" },
        // Canales 9-12
        { id: 8, nombre: "CANAL 9", userA: "equipoA", userB: "equipoB", emoji: "⚽", color: "#3498db" },
        { id: 9, nombre: "CANAL 10", userA: "grupoX", userB: "grupoY", emoji: "🎮", color: "#2ed573" },
        { id: 10, nombre: "CANAL 11", userA: "sala1", userB: "sala2", emoji: "🏛️", color: "#ff6b6b" },
        { id: 11, nombre: "CANAL 12", userA: "claseA", userB: "claseB", emoji: "📖", color: "#ffa502" },
        // Canales 13-16
        { id: 12, nombre: "CANAL 13", userA: "reunion1", userB: "reunion2", emoji: "🗣️", color: "#9b59b6" },
        { id: 13, nombre: "CANAL 14", userA: "evento1", userB: "evento2", emoji: "🎉", color: "#3498db" },
        { id: 14, nombre: "CANAL 15", userA: "directo1", userB: "directo2", emoji: "📹", color: "#2ed573" },
        { id: 15, nombre: "CANAL 16", userA: "extra1", userB: "extra2", emoji: "⭐", color: "#ff6b6b" }
    ];

    let instanciasWalkies = {}; // Guardar instancias activas
    let canalActivo = null;
    let walkieInstanceActivo = null;

    // Función para generar el HTML de una miniatura
    function generarMiniatura(canal) {
        return `
            <div class="thumbnail-card" data-canal-id="${canal.id}">
                <div class="thumbnail-img">
                    <div class="emoji-big">${canal.emoji}</div>
                    <div class="status-led offline" id="led_${canal.id}"></div>
                </div>
                <div class="thumbnail-info">
                    <div class="thumbnail-title">${canal.nombre}</div>
                    <div class="thumbnail-channel">${canal.userA} / ${canal.userB}</div>
                    <div class="thumbnail-stats">
                        <span>🎤 voz</span>
                        <span>💬 chat</span>
                        <span>🔊 ML</span>
                    </div>
                </div>
            </div>
        `;
    }

    // Renderizar todas las miniaturas
    const grid = document.getElementById('thumbnailsGrid');
    canales.forEach(canal => {
        grid.insertAdjacentHTML('beforeend', generarMiniatura(canal));
    });

    // Clase WalkieInstance (versión compacta para el player)
    class WalkiePlayerInstance {
        constructor(canal, containerId) {
            this.canal = canal;
            this.idx = canal.id;
            this.userAId = canal.userA;
            this.userBId = canal.userB;
            this.nombreA = canal.userA;
            this.nombreB = canal.userB;
            this.miId = "";
            this.idDestino = "";
            this.peer = null;
            this.stream = null;
            this.llamada = null;
            this.audio = null;
            this.conectado = false;
            this.hablando = false;
            this.dataConnection = null;
            this.modoActual = "voz";
            this.manosLibresActivo = false;
            this.cambioAutomaticoHabilitado = true;
            this.reconectando = false;
            this.container = document.getElementById(containerId);
            this.initDOM();
            this.initEventListeners();
            this.actualizarLED(false);
        }

        actualizarLED(conectado) {
            const led = document.getElementById(`led_${this.idx}`);
            if(led) {
                if(conectado) {
                    led.classList.remove('offline');
                    led.classList.add('online');
                } else {
                    led.classList.remove('online');
                    led.classList.add('offline');
                }
            }
        }

        initDOM() {
            this.miIdSpan = this.container.querySelector('.miId');
            this.otroIdSpan = this.container.querySelector('.otroId');
            this.miIdPeque = this.container.querySelector('.miIdPeque');
            this.otroIdPeque = this.container.querySelector('.otroIdPeque');
            this.statusMi = this.container.querySelector('.status-mi');
            this.statusOtro = this.container.querySelector('.status-otro');
            this.estadoDiv = this.container.querySelector('.estadoDiv');
            this.pttBtn = this.container.querySelector('.ptt-btn');
            this.chatMsgs = this.container.querySelector('.chatMsgs');
            this.msgInput = this.container.querySelector('.msgInput');
            this.panelChat = this.container.querySelector('.panelChat');
            this.btnVoz = this.container.querySelector('.btnVoz');
            this.btnTexto = this.container.querySelector('.btnTexto');
            this.indicadorDiv = this.container.querySelector('.hablando-indicador');
            this.modoBtn = this.container.querySelector('.modoBtn');
            this.limpiarBtn = this.container.querySelector('.limpiarBtn');
            this.llamarBtn = this.container.querySelector('.llamarBtn');
            this.manosLibresBtn = this.container.querySelector('.manosLibresBtn');
        }

        actualizarIndicador(hablando, quien) {
            if(!this.indicadorDiv) return;
            if(hablando) {
                this.indicadorDiv.innerHTML = `<span style="color:#ff4757;animation:pulse 1s infinite;">🎤 ${quien} está hablando 🔴</span>`;
            } else {
                this.indicadorDiv.innerHTML = `<span style="color:#888;">🔇 Nadie está hablando</span>`;
            }
        }

        mostrarToast(msg) {
            let toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        actualizarUI() {
            if(this.miIdSpan) this.miIdSpan.innerText = this.miId || "❌";
            if(this.otroIdSpan) this.otroIdSpan.innerText = this.idDestino || "❌";
            if(this.miIdPeque) this.miIdPeque.innerText = this.miId || "---";
            if(this.otroIdPeque) this.otroIdPeque.innerText = this.idDestino || "---";
            if(this.statusMi) this.statusMi.innerHTML = this.conectado ? '🟢 Conectado' : '🟡 Conectando...';
            if(this.statusOtro && this.idDestino) this.statusOtro.innerHTML = `🎯 ${this.idDestino}`;
            this.actualizarLED(this.conectado);
            
            const btnA = this.container.querySelector('.user-a');
            const btnB = this.container.querySelector('.user-b');
            if(btnA && btnB) {
                if(this.miId === this.userAId) {
                    btnA.classList.add('selected');
                    btnB.classList.remove('selected');
                } else if(this.miId === this.userBId) {
                    btnB.classList.add('selected');
                    btnA.classList.remove('selected');
                } else {
                    btnA.classList.remove('selected');
                    btnB.classList.remove('selected');
                }
            }
        }

        actualizarEstado(texto, tipo) {
            if(this.estadoDiv) {
                this.estadoDiv.innerHTML = texto;
                this.estadoDiv.className = `estadoDiv ${tipo}`;
            }
        }

        reproducirSonidoLocal() {
            try { new Audio('sonido.wav').play().catch(e=>{}); } catch(e){}
        }
        reproducirSonidoLlamada() {
            try { new Audio('sonido2.wav').play().catch(e=>{}); } catch(e){}
        }

        agregarMensajeChat(remitente, texto, esMio) {
            if(!this.chatMsgs) return;
            if(this.chatMsgs.children.length === 1 && this.chatMsgs.children[0].innerText.includes("Mensajes")) {
                this.chatMsgs.innerHTML = "";
            }
            const msgDiv = document.createElement('div');
            msgDiv.className = esMio ? 'mensaje-propio' : 'mensaje-otro';
            msgDiv.innerHTML = `<div class="mensaje-nombre">${remitente}:</div><div>${texto}</div>`;
            this.chatMsgs.appendChild(msgDiv);
            this.chatMsgs.scrollTop = this.chatMsgs.scrollHeight;
        }

        enviarEstadoHablando(estado) {
            if (this.dataConnection && this.dataConnection.open) {
                this.dataConnection.send({ type: 'hablando', desde: this.miId, estado: estado });
            }
        }

        cambiarATextoAutomatico(origen) {
            if (!this.cambioAutomaticoHabilitado || this.modoActual === "texto") return;
            this.cambioAutomaticoHabilitado = false;
            this.modoActual = "texto";
            this.btnVoz.style.background = '#1e1e2a';
            this.btnTexto.style.background = '#ffa502';
            this.pttBtn.style.display = 'none';
            this.panelChat.style.display = 'block';
            if (this.hablando && !this.manosLibresActivo) {
                this.detenerLlamada();
                this.hablando = false;
                this.pttBtn.style.background = 'radial-gradient(#34495e,#2c3e50)';
                this.pttBtn.innerHTML = '🎤<br>MANTÉN PTT';
                this.enviarEstadoHablando(false);
            }
            setTimeout(() => { this.cambioAutomaticoHabilitado = true; }, 500);
        }

        cambiarAVozManual() {
            if (this.modoActual === "voz") return;
            this.modoActual = "voz";
            this.btnVoz.style.background = '#2ed573';
            this.btnTexto.style.background = '#1e1e2a';
            this.pttBtn.style.display = 'flex';
            this.panelChat.style.display = 'none';
        }

        async iniciarLlamada() {
            if(!this.peer || !this.idDestino) return false;
            if(!this.stream) {
                try { 
                    this.stream = await navigator.mediaDevices.getUserMedia({ audio: true }); 
                    this.stream.getAudioTracks().forEach(t => t.enabled = false); 
                } catch(e) { 
                    this.mostrarToast('🎤 Permite el micrófono'); 
                    return false; 
                }
            }
            this.stream.getAudioTracks().forEach(t => t.enabled = true);
            if(this.llamada) try { this.llamada.close(); } catch(e) {}
            try {
                this.llamada = this.peer.call(this.idDestino, this.stream);
                return true;
            } catch(e) { return false; }
        }

        detenerLlamada() { 
            if(this.stream) this.stream.getAudioTracks().forEach(t => t.enabled = false); 
            if(this.llamada) { try { this.llamada.close(); } catch(e) {} this.llamada = null; } 
        }

        enviarMensajeTexto() {
            const texto = this.msgInput?.value.trim();
            if(!texto) { this.mostrarToast('📝 Escribe un mensaje'); return; }
            if(!this.idDestino) { this.mostrarToast('⚠️ Selecciona identidad'); return; }
            if (this.modoActual !== "texto") this.cambiarATextoAutomatico("Yo");
            if (this.dataConnection?.open) {
                this.dataConnection.send({ type: 'texto', desde: this.miId, texto: texto });
                this.dataConnection.send({ type: 'sonido', desde: this.miId });
                this.agregarMensajeChat(this.miId, texto, true);
                this.msgInput.value = '';
            } else { this.mostrarToast('🔄 Canal no disponible'); }
        }

        establecerConexionDatos() {
            if (!this.peer || !this.idDestino) return;
            if (this.dataConnection?.open) return;
            try {
                this.dataConnection = this.peer.connect(this.idDestino, { reliable: true });
                this.dataConnection.on('open', () => { this.dataConnection.send({ type: 'handshake', desde: this.miId }); });
                this.dataConnection.on('data', (data) => {
                    if (data.type === 'texto') {
                        this.agregarMensajeChat(data.desde, data.texto, false);
                        if (this.cambioAutomaticoHabilitado && this.modoActual !== "texto") {
                            this.cambiarATextoAutomatico(data.desde);
                        }
                    } else if (data.type === 'sonido') this.reproducirSonidoLocal();
                    else if (data.type === 'llamada') {
                        this.mostrarToast(`📞 ${data.desde} te llama!`);
                        this.reproducirSonidoLlamada();
                    } else if (data.type === 'hablando') this.actualizarIndicador(data.estado, data.desde);
                });
                this.dataConnection.on('close', () => { this.dataConnection = null; });
            } catch(e) {}
        }

        conectarPeer(miID, otroID) {
            if(this.reconectando) return;
            this.reconectando = true;
            if (this.peer) { try { this.peer.destroy(); } catch(e) {} this.peer = null; }
            this.miId = miID; this.idDestino = otroID; this.conectado = false; this.hablando = false;
            this.actualizarUI();
            this.mostrarToast(`🔌 Conectando como "${miID}"...`);
            this.actualizarEstado(`🔄 Conectando como "${miID}"...`, 'amarillo');
            if(this.pttBtn) this.pttBtn.classList.add('disabled');
            try {
                this.peer = new Peer(miID, PEER_CONFIG);
                this.peer.on('open', () => {
                    this.conectado = true;
                    this.reconectando = false;
                    this.actualizarEstado(`✅ Conectado como "${this.miId}"`, 'verde');
                    if(this.pttBtn) this.pttBtn.classList.remove('disabled');
                    this.mostrarToast(`✅ Conectado como "${this.miId}"!`);
                    this.actualizarUI();
                    this.establecerConexionDatos();
                });
                this.peer.on('connection', (conn) => {
                    if (this.dataConnection) try { this.dataConnection.close(); } catch(e) {}
                    this.dataConnection = conn;
                    this.dataConnection.on('open', () => { this.dataConnection.send({ type: 'handshake', desde: this.miId }); });
                    this.dataConnection.on('data', (data) => {
                        if (data.type === 'texto') {
                            this.agregarMensajeChat(data.desde, data.texto, false);
                            if (this.cambioAutomaticoHabilitado && this.modoActual !== "texto") this.cambiarATextoAutomatico(data.desde);
                        } else if (data.type === 'sonido') this.reproducirSonidoLocal();
                        else if (data.type === 'llamada') { this.mostrarToast(`📞 ${data.desde} te llama!`); this.reproducirSonidoLlamada(); }
                        else if (data.type === 'hablando') this.actualizarIndicador(data.estado, data.desde);
                    });
                });
                this.peer.on('call', (call) => {
                    if (this.stream) {
                        call.answer(this.stream);
                        call.on('stream', (s) => {
                            if (this.audio) { this.audio.pause(); this.audio.srcObject = null; }
                            this.audio = new Audio();
                            this.audio.srcObject = s;
                            this.audio.autoplay = true;
                        });
                    }
                });
                this.peer.on('error', (err) => {
                    this.reconectando = false;
                    if (err.type === 'unavailable-id') {
                        this.mostrarToast(`❌ ID "${miID}" ya en uso`);
                        this.actualizarEstado(`❌ ID "${miID}" ocupado`, 'rojo');
                    }
                });
                this.peer.on('disconnected', () => { this.conectado = false; if(this.pttBtn) this.pttBtn.classList.add('disabled'); this.actualizarLED(false); });
            } catch(e) { this.reconectando = false; }
        }

        seleccionarUserA() { if(this.miId === this.userAId) return; if(this.peer) this.peer.destroy(); this.conectarPeer(this.userAId, this.userBId); }
        seleccionarUserB() { if(this.miId === this.userBId) return; if(this.peer) this.peer.destroy(); this.conectarPeer(this.userBId, this.userAId); }
        
        limpiar() {
            if(this.dataConnection) this.dataConnection.close();
            if(this.llamada) this.llamada.close();
            if(this.peer) this.peer.destroy();
            if(this.stream) this.stream.getTracks().forEach(t => t.stop());
            this.conectado = false; this.hablando = false;
            this.miId = ""; this.idDestino = "";
            this.actualizarUI();
            this.actualizarEstado(`🧹 Limpiado. Selecciona ${this.nombreA} o ${this.nombreB}`, 'amarillo');
            if(this.pttBtn) this.pttBtn.classList.add('disabled');
            this.actualizarIndicador(false, "");
            this.dataConnection = null; this.peer = null; this.stream = null; this.llamada = null;
            this.actualizarLED(false);
        }
        
        toggleManosLibres() {
            this.manosLibresActivo = !this.manosLibresActivo;
            if (this.manosLibresActivo) {
                this.manosLibresBtn.classList.add('activo');
                this.manosLibresBtn.innerHTML = '🎙️ MANOS LIBRES ON';
                this.pttBtn.style.opacity = '0.5';
                this.pttBtn.style.pointerEvents = 'none';
                if (this.llamada && this.stream) { this.stream.getAudioTracks().forEach(t => t.enabled = true); this.enviarEstadoHablando(true); }
                else if (this.conectado && this.idDestino) { this.iniciarLlamada().then(() => { if(this.stream) { this.stream.getAudioTracks().forEach(t => t.enabled = true); this.enviarEstadoHablando(true); } }); }
            } else {
                this.manosLibresBtn.classList.remove('activo');
                this.manosLibresBtn.innerHTML = '🔊 MANOS LIBRES';
                this.pttBtn.style.opacity = '1';
                this.pttBtn.style.pointerEvents = 'auto';
                if (this.llamada && this.hablando) { this.detenerLlamada(); this.hablando = false; this.enviarEstadoHablando(false); }
            }
        }
        
        enviarLlamada() {
            if (!this.idDestino) { this.mostrarToast('⚠️ Selecciona identidad'); return; }
            if (!this.conectado) { this.mostrarToast('⚠️ Espera conexión'); return; }
            if (this.dataConnection?.open) {
                this.dataConnection.send({ type: 'llamada', desde: this.miId });
                this.reproducirSonidoLlamada();
                this.mostrarToast(`✅ Notón a ${this.idDestino}`);
            } else { this.mostrarToast('🔄 Canal no disponible'); }
        }
        
        toggleModo() { if (this.modoActual === "voz") this.cambiarAVozManual(); else this.cambiarAVozManual(); }

        initEventListeners() {
            const btnA = this.container.querySelector('.user-a');
            const btnB = this.container.querySelector('.user-b');
            const enviarBtn = this.container.querySelector('.enviarBtn');
            
            if(btnA) btnA.onclick = () => this.seleccionarUserA();
            if(btnB) btnB.onclick = () => this.seleccionarUserB();
            if(this.modoBtn) this.modoBtn.onclick = () => this.toggleModo();
            if(this.limpiarBtn) this.limpiarBtn.onclick = () => this.limpiar();
            if(this.llamarBtn) this.llamarBtn.onclick = () => this.enviarLlamada();
            if(this.manosLibresBtn) this.manosLibresBtn.onclick = () => this.toggleManosLibres();
            if(enviarBtn) enviarBtn.onclick = () => this.enviarMensajeTexto();
            if(this.msgInput) this.msgInput.onkeypress = (e) => { if (e.key === 'Enter') this.enviarMensajeTexto(); };
            if(this.btnVoz) this.btnVoz.onclick = () => this.cambiarAVozManual();
            if(this.btnTexto) this.btnTexto.onclick = () => this.cambiarATextoAutomatico("Manual");
            
            if(this.pttBtn) {
                let isPressed = false;
                const startTalk = async () => {
                    if (this.manosLibresActivo) return;
                    if (!this.conectado) { this.mostrarToast('⚠️ Espera conexión'); return; }
                    if (!this.hablando && !isPressed) {
                        isPressed = true;
                        if(await this.iniciarLlamada()) {
                            this.hablando = true;
                            this.pttBtn.style.background = 'radial-gradient(#ff4757,#c0392b)';
                            this.pttBtn.innerHTML = '🎤<br>HABLANDO';
                            this.enviarEstadoHablando(true);
                        } else isPressed = false;
                    }
                };
                const stopTalk = () => {
                    if (this.manosLibresActivo) return;
                    if (this.hablando && isPressed) {
                        this.detenerLlamada();
                        this.hablando = false;
                        this.pttBtn.style.background = 'radial-gradient(#34495e,#2c3e50)';
                        this.pttBtn.innerHTML = '🎤<br>MANTÉN PTT';
                        this.enviarEstadoHablando(false);
                    }
                    isPressed = false;
                };
                this.pttBtn.onmousedown = startTalk;
                this.pttBtn.onmouseup = stopTalk;
                this.pttBtn.onmouseleave = stopTalk;
                this.pttBtn.ontouchstart = (e) => { e.preventDefault(); startTalk(); };
                this.pttBtn.ontouchend = (e) => { e.preventDefault(); stopTalk(); };
            }
        }
    }

    // Generar el HTML del walkie completo para un canal
    function generarWalkieHTML(canal) {
        return `
            <div id="walkiePlayer_${canal.id}" class="walkie-embed">
                <div class="embed-header" style="text-align:center;margin-bottom:15px;">
                    <h2 style="color:#ff6b6b;margin:0;">📞 WALKIE ${canal.nombre}</h2>
                    <p style="color:#2ed573;margin:5px 0;">${canal.userA} ↔ ${canal.userB}</p>
                </div>
                
                <div class="hablando-indicador" style="background:#0a0a0f;border-radius:12px;padding:8px;margin-bottom:15px;text-align:center;">
                    <span style="color:#888;">🔇 Nadie está hablando</span>
                </div>
                
                <div class="selector-panel" style="background:#0a0a0f;border-radius:18px;padding:15px;margin-bottom:20px;">
                    <div class="selector-title" style="color:#888;text-align:center;margin-bottom:12px;">🎭 ELIGE TU IDENTIDAD:</div>
                    <div class="user-buttons" style="display:flex;gap:15px;">
                        <button class="user-btn user-a" style="flex:1;padding:15px;border:2px solid #2ed573;background:transparent;border-radius:25px;color:white;font-weight:bold;cursor:pointer;">👤 ${canal.userA}</button>
                        <button class="user-btn user-b" style="flex:1;padding:15px;border:2px solid #2ed573;background:transparent;border-radius:25px;color:white;font-weight:bold;cursor:pointer;">👥 ${canal.userB}</button>
                    </div>
                </div>
                
                <div class="ids-panel" style="background:#0a0a0f;border-radius:18px;padding:15px;margin-bottom:20px;">
                    <div class="id-row" style="display:flex;justify-content:space-between;margin-bottom:8px;"><span style="color:#888;">🎭 Mi ID:</span><span class="miId" style="color:#2ed573;">---</span></div>
                    <div class="id-row" style="display:flex;justify-content:space-between;"><span style="color:#888;">👥 ID amigo:</span><span class="otroId" style="color:#2ed573;">---</span></div>
                </div>
                
                <div style="background:#1e1e2a;border-radius:12px;padding:10px;margin-bottom:15px;text-align:center;font-size:0.8rem;">
                    🔄 Mantenimiento activo | 🎵 Anti-suspensión ON
                </div>
                
                <div style="display:flex;gap:15px;margin-bottom:20px;">
                    <div class="card-mi" style="flex:1;text-align:center;padding:15px;background:#1e1e2a;border-radius:25px;"><div style="font-weight:bold;">🎭 YO</div><div class="status-mi" style="font-size:0.75rem;">---</div><div class="miIdPeque" style="font-size:0.75rem;color:#2ed573;">---</div></div>
                    <div class="card-otro" style="flex:1;text-align:center;padding:15px;background:#1e1e2a;border-radius:25px;"><div style="font-weight:bold;">👥 OTRO</div><div class="status-otro" style="font-size:0.75rem;">---</div><div class="otroIdPeque" style="font-size:0.75rem;color:#2ed573;">---</div></div>
                </div>
                
                <div class="botonera" style="display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;">
                    <button class="modoBtn" style="flex:1;padding:12px;border:none;border-radius:14px;background:#2ed573;color:white;font-weight:bold;cursor:pointer;">📻 MODO PTT</button>
                    <button class="limpiarBtn" style="flex:1;padding:12px;border:none;border-radius:14px;background:#e74c3c;color:white;font-weight:bold;cursor:pointer;">🧹 LIMPIAR</button>
                    <button class="llamarBtn" style="flex:1;padding:12px;border:none;border-radius:14px;background:#9b59b6;color:white;font-weight:bold;cursor:pointer;">📞 LLAMAR</button>
                    <button class="manosLibresBtn" style="flex:1;padding:12px;border:none;border-radius:14px;background:#3498db;color:white;font-weight:bold;cursor:pointer;">🔊 MANOS LIBRES</button>
                </div>
                
                <div class="ptt-btn disabled" style="width:140px;height:140px;border-radius:50%;background:radial-gradient(#34495e,#2c3e50);border:5px solid #ecf0f1;margin:20px auto;display:flex;align-items:center;justify-content:center;flex-direction:column;color:white;font-weight:bold;cursor:pointer;">🎤<br>PTT</div>
                
                <div class="chat-area" style="margin-top:20px;border-top:1px solid #2c2c3e;padding-top:15px;">
                    <div style="display:flex;gap:10px;margin-bottom:12px;">
                        <button class="btnVoz" style="flex:1;padding:10px;border:none;border-radius:12px;background:#2ed573;color:white;font-weight:bold;cursor:pointer;">🎤 VOZ</button>
                        <button class="btnTexto" style="flex:1;padding:10px;border:none;border-radius:12px;background:#1e1e2a;color:white;font-weight:bold;cursor:pointer;">💬 TEXTO</button>
                    </div>
                    <div class="panelChat" style="display:none;">
                        <div class="chatMsgs" style="background:#0a0a0f;border-radius:18px;padding:12px;height:120px;overflow-y:auto;font-size:0.8rem;"><div style="color:#888;text-align:center;">💬 Mensajes</div></div>
                        <div style="display:flex;gap:10px;margin-top:12px;"><input type="text" class="msgInput" placeholder="Mensaje..." style="flex:1;padding:12px;border-radius:25px;border:none;background:#1e1e2a;color:white;"><button class="enviarBtn" style="background:#2ed573;border:none;border-radius:25px;padding:0 20px;font-weight:bold;cursor:pointer;">📨</button></div>
                    </div>
                </div>
                
                <div class="estadoDiv rojo" style="text-align:center;margin-top:12px;padding:10px;border-radius:12px;background:#ff475722;color:#ff4757;">⚡ Selecciona ${canal.userA} o ${canal.userB}</div>
            </div>
        `;
    }

    // Abrir un canal en el reproductor
    function abrirCanal(canal) {
        // Si ya hay un walkie activo, limpiarlo
        if(walkieInstanceActivo) {
            walkieInstanceActivo.limpiar();
            walkieInstanceActivo = null;
        }
        
        const playerContainer = document.getElementById('playerContainer');
        const walkiePlayerDiv = document.getElementById('walkiePlayer');
        const playerTitle = document.getElementById('playerTitle');
        
        // Generar HTML del walkie
        walkiePlayerDiv.innerHTML = generarWalkieHTML(canal);
        playerTitle.innerHTML = `📞 WALKIE ${canal.nombre}`;
        playerContainer.style.display = 'block';
        
        // Inicializar la instancia del walkie
        walkieInstanceActivo = new WalkiePlayerInstance(canal, `walkiePlayer_${canal.id}`);
        instanciasWalkies[canal.id] = walkieInstanceActivo;
        
        canalActivo = canal.id;
        
        // Scroll suave al reproductor
        playerContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
        
        // Resaltar miniatura activa
        document.querySelectorAll('.thumbnail-card').forEach(card => {
            card.classList.remove('active');
        });
        const activeCard = document.querySelector(`.thumbnail-card[data-canal-id="${canal.id}"]`);
        if(activeCard) activeCard.classList.add('active');
    }

    // Cerrar reproductor
    function cerrarPlayer() {
        if(walkieInstanceActivo) {
            walkieInstanceActivo.limpiar();
            walkieInstanceActivo = null;
        }
        document.getElementById('playerContainer').style.display = 'none';
        document.querySelectorAll('.thumbnail-card').forEach(card => {
            card.classList.remove('active');
        });
        canalActivo = null;
    }

    // Evento click en miniaturas
    document.querySelectorAll('.thumbnail-card').forEach((card, idx) => {
        card.addEventListener('click', () => {
            const canalId = parseInt(card.getAttribute('data-canal-id'));
            const canal = canales.find(c => c.id === canalId);
            if(canal) abrirCanal(canal);
        });
    });

    // Botón cerrar
    document.getElementById('closePlayerBtn').addEventListener('click', cerrarPlayer);

    // Precargar micrófono
    async function preloadMic() {
        try { await navigator.mediaDevices.getUserMedia({ audio: true }); } catch(e) {}
    }
    preloadMic();
})();
</script>
